301 — (1) شاشة «دخول غرفة»: عند كتابة كود خاطئ لم يعد الزر يبقى عالقًا؛ بمجرد تغيير أي رقم تُلغى المحاولة الحالية ويرجع زر «دخول» فعّالًا فورًا بدون رجوع وإعادة كتابة الكود، وبعد فشل الاتصال يبقى الكود مكتوبًا لتعدّل رقمًا واحدًا، والكود الناقص يظهر تنبيهًا بدل شاشة خطأ. (2) إصلاح قص نقطتي التاء المربوطة في عنوان «جلسة» (وبقية العناوين) بزيادة المساحة العلوية للنص المتدرج.
300 — نمط المحكمة: (1) كاميرا القاضي: إزالة الرجوع التلقائي للمنتصف بعد رفع الإصبع (كان تخميدًا أسيًا يصفّر الدوران)، فتبقى الزاوية التي تركتها؛ مع تحديد مدى الدوران والميلان حتى لا تبتعد الكاميرا بشكل غريب، وتبدأ كل جولة من المنتصف. (2) المتهم فقط يرى حقيقته: «أنت مذنب، حاول تقنع القاضي!» (أحمر) أو «أنت بريء، برّر نفسك!» (أخضر) في لوحته طوال الجولة، ولا يظهر ذلك لغيره.
299 — نمط المافيا: إضافة المايك بقواعد صارمة. الصباح (الخبر/النقاش/التصويت/النتيجة): كل اللاعبين الأحياء يتكلمون ويسمعون بعض. الليل: الجميع مكتومون عدا المافيا الأحياء، وصوتهم يصل للمافيا الأحياء فقط ولا يسمعه أي مواطن أو ميت. التطبيق على مستوى المُرسِل (كل لاعب يرسل لكل لاعب مسارًا مستقلًا: صوتًا حقيقيًا أو صمتًا) وعلى مستوى المستقبِل معًا، وإخفاء أيقونة «يتكلم» عن غير المسموح لهم. كتم المايك تلقائيًا بالليل للمواطنين وإعادة فتحه صباحًا بدون ضغط. نمط المحكمة بلا تغيير.
298 — نمط المحكمة فقط: (1) بعد حكم القاضي تظهر له كلمة صغيرة «صح!» خضراء أو «خطأ!» حمراء بحسب صحة حكمه (تتلاشى خلال ثوانٍ) وقبل مشهد الإعدام السينمائي الذي يتأخر بمقدار 2.6 ثانية لجميع اللاعبين بالتزامن؛ وللبراءة تظهر الكلمة نفسها مع شاشة الحكم؛ (2) إصلاح اختفاء أصوات الجميع لثوانٍ عند كتم/فتح المايك: صار المايك يُفتح مرة واحدة ويُكتم/يُفعّل بتبديل المسار فقط بدل إيقافه وإعادة طلبه (الذي كان يغيّر وضع الصوت بالجهاز)، مع استئناف تلقائي لأصوات الآخرين.
297 — نمط المحكمة فقط: مشهد الإعدام السينمائي معاد بناؤه؛ كاميرا سينمائية موحّدة لكل اللاعبين (تقريب أمامي على المتهم، قطع جانبي لحظة فتح الباب مع اهتزاز، ثم دوران وابتعاد وتعتيم) بدل لقطة القاضي من خلف المشنقة؛ مشنقة جديدة (منصة بدرجات وفتحة باب وأعمدة ودعامات وفوانيس ورافعة)؛ المتهم له أرجل وتتدلى يداه؛ إخفاء لافتات الأسماء والأدوار أثناء المشهد؛ إضاءة دافئة وضوء أحمر بعد النزول؛ إصلاح تسريب إنشاء لافتة الدور كل فريم أثناء المشهد.
296 — نمط المحكمة فقط: توسيع حدود تدوير الرأس لغير القاضي (حتى نحو 109° لكل جهة) مع حساسية سحب أعلى وحد ميلان أوسع، ليقدر المتهم والمدعي والمحامي والشهود يشوفون كل اللاعبين.
295 — نمط المحكمة فقط: واجهة القاضي معاد تصميمها بشكل مدمج (نحو 27% من الشاشة بدل 54%): هيدر بالوقت، زرا الحكم جنب بعض، صف مطرقة وتأكيد، وقائمة مايكات قابلة للطي؛ كاميرا القاضي صارت واسعة وتتكيف مع حجم اللوحة لتُظهر المدعي والمتهم والمحامي، مع زر «الأطراف | الشهود» للتنقل لمنصة الشهود.
294 — نمط المحكمة (إعادة تصميم): الأدوار صارت قاضي + متهم واحد + محامي دفاع + مدعي (رافع القضية) + باقي اللاعبين شهود؛ ورقة سرية لكل من المدعي والمحامي والشهود (بعضها لصالح المتهم وبعضها ضده) تُفتح بنافذة منبثقة؛ تهم أكثرها كبيرة (قتل/خيانة عظمى كوميدية) بنسبة ظهور أعلى؛ الكاميرا مقيّدة بزاوية ضيقة؛ القاضي يكتم أي لاعب (يُطبَّق على المايك والصوت)؛ زر مطرقة بأنيميشن وصوت طرقة؛ حكم إعدام/براءة، وعند الإعدام مشهد سينمائي (المشنقة) مع قفل كاميرات الجميع؛ واجهة قاضي جديدة (حكم، مطرقة، مايكات، وقت، أدلة)؛ تدوير أدوار عشوائي بدون تكرار نفس الدور مباشرة.
293 — نمط المحكمة فقط: (1) سقف للمحكمة وجدران مغلقة (كان السقف أسود)؛ (2) حل كلتش لوحة الأسئلة اللي كانت تطلع بنص الشاشة عند تحريك الكاميرا (إخفاء مشهد اللعبة الأساسية صار قبل كل رسم)؛ (3) الكاميرا صارت من مكان شخصيتك (القاضي/المتهم/المحامي/المحلف) وتواجه القاضي؛ (4) القاضي عنده أزرار الحكم (مذنب + تأكيد) طول وقت المرافعة؛ (5) حذف أزرار تخطي الجولة/إنهاء المحكمة من المضيف والمتهم؛ (6) دور جديد «المحامي»: لكل متهم محامي جالس بصفه ووجهه للقاضي (إذا ما كفى العدد يبقى متهم بدون محامي)، وعنده ورقة دليل سرية تساعد المتهم، وتنكشف الأوراق مع الحكم؛ المايك متاح للمحامي؛ (7) واجهة القاضي جديدة: بطاقات المتهمين والمحامين.
292 — نمط جديد «المحكمة» (4–10 لاعبين): غرفة محكمة ثلاثية الأبعاد (قاضٍ على منصة مع مطرقة، متهمان على طاولتين مع حقائب، هيئة المحلفين على يسار القاضي)؛ اختيار عشوائي لكل جولة (قاضٍ + متهمين) بدون تكرار نفس الشخص في نفس الدور حتى تُستنفد الدورة؛ تهمة كوميدية تظهر للجميع بلوحة متناسقة؛ مؤقت مرافعة من 2 إلى 10 دقائق بعدّاد مستمر يعمل على موعد نهائي ثابت؛ حكم القاضي ثم جولة جديدة تلقائياً. المايك صار حصرياً بنمط المحكمة وللقاضي والمتهمين فقط (لا يظهر زر المايك لهيئة المحلفين) ويُلغى بكل الأنماط الأخرى. باقي الأنماط لم تُمس.
291 — المايك: خيار جديد في الإعدادات > الصوت «السماح بالوصول للمايك» (تشغيل = يطلب إذن المتصفح، إيقاف = يلغي استخدام المايك داخل اللعبة)؛ وإذا كان الخيار مطفي وضغط اللاعب زر المايك داخل اللعبة يُطلب الإذن ويتفعّل الخيار تلقائياً؛ رسائل خطأ أوضح (رابط غير آمن / إذن مرفوض / لا يوجد مايك) وعدم تكرار الرسالة. منطق اللعب لم يُمس.
290 — إصدار اختبار المايك: إلغاء الربط بخادم TURN (ExpressTURN) من إعدادات الاتصال، وبقي الأونلاين كما هو عبر PeerJS وخوادم STUN فقط. الإصدارات السابقة لم تُمس. منطق اللعب لم يُمس.
289 — المايك: عند كلام أي لاعب يظهر فوق رأسه مايك أخضر (رسمة مايك كلاسيكي بدون إيموجي) ينبض مع قوة الصوت؛ وزر المايك صار بستايل اللعبة (خشب داكن + إطار ذهبي، مايك نحاسي مشطوب عند الكتم وأخضر متوهج عند التشغيل، ويتلون بألوان المافيا). منطق اللعب لم يُمس.
288 — مايك صوتي في كل الأنماط: زر صغير بالزاوية اليمنى السفلى (يظهر داخل أي غرفة)، اضغطه لتشغيل/كتم مايكك وكل اللاعبين يسمعونك تلقائياً (اتصال صوتي مباشر بين اللاعبين عبر نفس PeerJS). منطق اللعب لم يُمس.
287 — الاتصال: خادم TURN جديد (ExpressTURN) بدل الخادم العام القديم اللي ما يشتغل، مع تقليل عدد الخوادم (أسرع بالاتصال) وإيقاف الحجز المسبق للمرشحين (يوفّر حصة الخادم)؛ رسالة الدخول صارت تفرّق بين «لا يوجد غرفة» و«فشل الاتصال بالمضيف»؛ مهلة الدخول من 22 إلى 40 ثانية حتى ما ينقطع الاتصال البطيء قبل ما يكتمل. منطق اللعب لم يُمس.
286 — الشبكة (طبقة النقل فقط): المضيف صار يرسل «التغييرات فقط» لكل لاعب بدل الحالة الكاملة (الصور والبيانات الثقيلة تُرسل مرة واحدة عند الدخول)؛ ترقيم للرسائل مع طلب مزامنة كاملة تلقائياً إذا ضاعت رسالة؛ شكل الحالة عند اللاعبين وكل أنماط اللعب لم تُمس.
285 — نمط المؤقت: حذف شريط أسماء/نقاط اللاعبين من أعلى الشاشة؛ والشريطان (الوقت الكلي + الجولة) صارا بنفس ستايل اللعبة (خشب داكن + إطار ذهبي خافت، الكلي برونزي/كريمي والجولة عنبري متوهج، وأحمر جمري في آخر 15%).
284 — نمط المؤقت: حذف نص الوقت الكلي الباقي (مثل 10:00) من أعلى الشاشة وإضافة شريط رفيع يمثل الوقت الكلي الباقي (يتحول للأحمر في آخر 15%)؛ بقي نص «جولة N» وشريط الجولة كما هو. باقي الأنماط لم تُمس.
283 — حذف شريط الأسماء/النقاط من منتصف أعلى الشاشة في أنماط: الأعلام، حدود الدول، كلمات إنجليزي، برا السالفة، ربط الكلمات، الأسئلة العامة (سولو)، الأكواب؛ وفي التيمات صار يظهر فقط عدّاد نقاط الفريقين (بدون أسماء اللاعبين). الأسماء تبقى فوق اللاعبين الجالسين. باقي الأنماط (مافيا، كودنايمز، تلميح، المؤقت) لم تُمس.
282 — التيمات (الأسئلة العامة): زر «🤖 إضافة AI» للمضيف في لوبي التيمات (وزر حذف لكل بوت) بنفس آلية بوتات المافيا وكودنايمز؛ البوت يتوزع تلقائياً على الفريق الأصغر؛ إذا ما تطوع أحد لاعب كقائد وفي بوتات بالفريق يُختار بوت عشوائي قائداً، والبوت القائد يكتب الإجابة ويرسلها بنفسه (يستفيد من اقتراحات فريقه). باقي الأنماط وآلية اللعب لم تُمس.
281 — كودنايمز: ظهر البطاقات المكشوفة صار رسمة العين والأغصان والإطار المثمّن (من الصورة المرفقة) بلون البطاقة الأصلي الداكن (أحمر/أزرق/محايد/قاتل)؛ الرسمة تُعرَّف مرة واحدة وتُستعمل في كل البطاقات. (276–280 لم يُسجَّل لها سطر.)
275 — كودنايمز (سجل اللعبة، على طريقة Codenames الأصلية): (1) صورة اللاعب اللي خمّن تظهر جنب الكلمة مع اسمه؛ (2) اللاعب اللي ضغط إنهاء الدور (تخطّي) يظهر تحت فريقه بصورته وعلامة ✓ خضراء؛ (3) القائد اللي أعطى التلميح تظهر صورته واسمه جنب التلميح. الصور تُقرأ من شخصية اللاعب (الصورة المرفوعة أو الشكل المرسوم).
274 — دخول غرفة: تحت خانة الكود تظهر رسالة «جاري دخول الغرفة» (مع دوّارة) عند الدخول، و«لا يوجد غرفة» (بالأحمر) إذا الغرفة غير موجودة؛ وعند فشل الدخول يرجع لشاشة الدخول بدل شاشة الخطأ.
273 — كودنايمز: (1) عدّاد الوقت صار في منتصف الشاشة بالضبط (كان مائلاً لليسار)؛ (2) سجل اللعبة يتمدد ليملأ الفراغ بين الفريقين ويعرض حوالي 4-5 تلميحات، والأقدم بالتمرير.
272 — كودنايمز: (1) سجل اللعبة يعرض آخر تلميح فقط بارتفاع ثابت (كل تلميح مع تخميناته في مجموعة)، والتلميحات القديمة بالتمرير لفوق بدون ما تكبّر الشاشة؛ (2) عدّاد الوقت صار مكان كلمة «كودنايمز» في المنتصف (بدل ما يختفي خلف زر الإعدادات).
271 — كودنايمز: إضافة 25 كلمة عربية جديدة مترابطة دلالياً إلى مجموعة كلمات كودنايمز (ضوء وزمن: فجر غروب ظل سراب / حرب: وزير حصن سهم خندق / كتابة: حبر سطر مخطوطة قصيدة / مال: ميزان صفقة ثروة خزنة / بحر وسفر: مرفأ رحلة ساحل ملاح / حواس: صدى نبض ذاكرة / محايدة: فانوس عتبة)؛ آلية اللعب لم تُمس.
270 — كودنايمز: (1) حذف بلوك التلميح المكرّر من سجل اللعبة بالكامل (يبقى فقط سطر التلميح في السجل)؛ (2) البطاقات رجعت مربعة متساوية بدل ما تتمدد بالطول؛ (3) المساحة المتبقية تروح لخانات اللاعبين/السجل (صارت أكبر وبخط أوضح).
269 — كودنايمز: (1) حذف البانر الأحمر الكبير للتلميح؛ التلميح والعدد والمحاولات المتبقية ودورك صارت داخل سجل اللعبة (game log) وحُذف سطرا «اضغط على البطاقات» و«أنت مخمّن…»؛ (2) حذف كل الإيموجيات من كودنايمز (👑 🤖 💀 🏆 ⚙ 🗣 ✅ ❌ 😉)؛ البوتات تُسمّى «اسم (AI)»؛ (3) قوائم اللاعبين (المخمّنون/القادة) بخط أكبر وأوضح وبدون قص، وعدّاد الكلمات فوقها، والتخطيط كله يتسع للشاشة بدون تمرير.

267 — كودنايمز: (1) إصلاح الرفرش/الترستة: الواجهة صارت تتحدّث بالمقارنة (morph) بدل إعادة بناء كل شيء عند كل ضغطة تصويت/اختيار، فما تنعاد الأنيميشنات ولا يرجع شريط المؤقت ولا تنقفز الشاشة؛ (2) المخمّنون يصوّتون على أكثر من بطاقة (اضغط البطاقة للتصويت واضغطها مرة ثانية لإلغاء التصويت)؛ (3) تأكيد الكلمة بزر أخضر صغير ✔ على زاوية البطاقة بدل الضغطة الثانية؛ (4) الأصوات تبقى على البطاقات الباقية بعد كل تخمين صحيح وتنمسح عند نهاية الدور.
266 — كودنايمز: إعدادات الغرفة صارت بسلايدر (عدد اللاعبين + مؤقت الدور)؛ حذف خيار عدد كلمات القاتل (ثابت كلمة واحدة) وخيار حزمة الكلمات (الكلمات عشوائية دائماً)؛ المضيف يغيّر المؤقت من اللوبي بسلايدر.
265 — كودنايمز: تطوير شامل كطبقة منفصلة (باقي الأنماط وآلية اللعب لم تُمس): (1) إعدادات جديدة: مؤقت الدور (45–180ث)، عدد كلمات القاتل 1–3، حزم كلمات (عامة/حيوانات/طبيعة/أماكن/أدوات/أكل/مهن)، ويعدّلها المضيف داخل اللوبي ويشوفها الكل؛ (2) خلفية متحركة تتلوّن حسب الفريق صاحب الدور؛ (3) لوحة تقدم الفريقين + شريط وقت + لافتة تلميح كبيرة؛ (4) بطاقات أوضح وأنيميشن كشف وانفجار للقاتل ومفتاح قائد أوضح؛ (5) بوتات أذكى (تتجنب القاتل وتكرار التلميح وتنهي الدور بذكاء)؛ (6) شاشة نهاية فيها إحصائيات وقصاصات احتفال.
264 — المافيا: (1) إصلاح: زر الشات ما كان يظهر لأن الشرط كان يحسب المافيا البشر فقط؛ هسه يظهر لأي مافيا (حتى الميت) إذا في أكثر من مافيا واحد حتى لو الباقي بوتات؛ (2) المافيا يعرفون حلفاءهم: أسماؤهم بلون أحمر متوهج فوق الكراسي وفي أزرار الاختيار، ولا يظهر ذلك لغير المافيا؛ (3) حذف قائمة اللاعبين العلوية في نمط المافيا.
263 — المافيا: (1) زر الشات صار بأيقونة فقاعة محادثة SVG واقعية بدل الايموجي 💬 (الزر وعنوان نافذة الشات)؛ يظهر للمافيا فقط (حتى الميت منهم) إذا في أكثر من مافيا بشري، ولا يظهر للمضيف إذا كان مواطناً؛ (2) إعداد جديد «وقت الليل (ث)» في إعدادات غرفة المافيا (30/45/60/90/120، الافتراضي 60) يحدد أقصى مدة لليل ويظهر عدّاد تنازلي في الليل.
262 — المافيا: شات سرّي بسيط للمافيا فقط (يظهر زر 💬 إذا كان في لاعبين اثنين أو أكثر من المافيا البشر). الرسائل تمر عبر المضيف وتُرسل لأعضاء المافيا فقط ولا تُخزَّن في الحالة المشتركة.
261 — المافيا: (1) أدوات المضيف صارت مطوية بزر صغير «⚙ أدوات المضيف» بدل أزرار كبيرة تغطي الشاشة؛ (2) لوبي المافيا يعرض الولد الصالح ضمن الأدوار؛ (3) إصلاح: الليل كان لا ينتهي إذا كان الولد الصالح لاعباً بشرياً حياً (لا يؤكد أبداً)؛ (4) سحب الولد الصالح صار يُعلن على الشاشة (صباحاً/بعد التصويت) ويُسجَّل في سجل اللعبة، مع شاشة خاصة أثناء اختياره.
260 — المافيا: إضافة بوتات AI (زر «🤖 إضافة AI» للمضيف في اللوبي وزر حذف لكل بوت) بنفس آلية بوتات كودنايمز؛ تلعب كل الأدوار وتصوّت. باقي الأنماط لم تُمس.
259 — ربط الكلمات: حذف شرط «لازم فيها حرف (X)» بالكامل (الكود والنص الظاهر على اللوحة وفي شريط الإدخال)؛ يبقى فقط حرف البداية والحد الأدنى لطول الكلمة.
258 — ملء الشاشة تلقائياً في اللعبة كلها (كل الأنماط والقوائم) عند أول لمسة، وإخفاء شريط المتصفح.
257 — ملء الشاشة لكودنايمز فقط (استُبدل).
256 — كودنايمز: حذف الشريط السفلي؛ إدخال التلميح (للقائد) وزر إنهاء الدور (للمخمّن) صارا داخل سجل اللعبة في أعلى الوسط.
255 — إصلاح: زر «ابدأ اللعبة» في كودنايمز كان يتوقف بخطأ في جلب قائمة الكلمات (DWL مصفوفة لا نص).
254 — كودنايمز: المضيف يوزّع البوتات يدوياً في اللوبي (اضغط على البوت ثم على الخانة المطلوبة: مخمّن/قائد لأي فريق، أو اضغط نفس الخانة لإلغاء التوزيع).
253 — كودنايمز: لوبي بنفس شاشة اللعبة (لوحات الفريقين: المخمّنون/القادة بضغطة للانضمام، سجل في المنتصف، لوحة بطاقات فارغة)، والمضيف يبدأ بزر ✔ فتظهر الكلمات.
252 — كودنايمز: حذف إعدادات عدد البطاقات وعدد القتلة وقائمة الكلمات (ثابتة كالأصلية: 25 بطاقة، قاتل واحد، كلمات عامة). تبقى إعدادات عدد اللاعبين والمؤقت.
251 — كودنايمز: شاشة إنشاء الغرفة بنفس نمط باقي الأنماط (خلفية خاصة بالنمط + شرائط تمرير sliders للأرقام) وعدد البطاقات 15/20/25.
250 — كودنايمز: صور شخصيات كرتونية (SVG مرسومة بالكود، بدون ملفات خارجية) على البطاقات المكشوفة بخلفية بلون الفريق (أحمر/أزرق/محايد/قاتل).
249 — كودنايمز: اختيار الفريق والقائد يدوياً، مؤقت دور تلقائي، مؤشرات التخمين مع تأكيد ✔، تلميح 0/∞، إعدادات (عدد البطاقات/القتلة/قائمة الكلمات)، بوت أذكى، حركة قلب البطاقة.
248 — واجهة كودنايمز الجديدة بفكرة «Codenames Online»: شاشة كاملة، لوحات الفرق (المخمّنون/القادة + عدّاد الكلمات الباقية)، سجل اللعبة (التلميحات والتخمينات، محفوظ عند المضيف في dLg)، بطاقات بشريط أبيض، وشريط سفلي للتلميح وزر ✔ لإنهاء الدور.
247 — كودنايمز فقط: زر «إضافة AI» للمضيف في اللوبي يضيف بوتات 🤖 تلعب قائداً ومخمّناً (تلميحات من فئات جاهزة، المفتاح يبقى عند المضيف فقط) وزر حذف للبوت.
246 — نمط جديد «كودنايمز» (Codenames): فريقان أحمر وأزرق، لوحة 5×5، قائد لكل فريق يستلم مفتاح الألوان سرًّا عبر whisper (لا يُنشر في الـpresence)، تلميح بكلمة ورقم، كلمة قاتل، زر إنهاء الدور، وشاشة نهاية تكشف اللوحة. إضافة فقط بدون تغيير سلوك باقي الأنماط.
245 — القائمة الرئيسية: رفع مجموعة (العنوان، الشعار النصي، خانة الاسم، أزرار إنشاء/دخول الغرفة، شارة الإصدار) للأعلى قليلًا بدل التوسيط التام، بحشوة سفلية متجاوبة مع ارتفاع الشاشة.
244 — إصلاحات بعد اختبار شامل للإعدادات واللعب: تنقية قيم الإعدادات التالفة في التخزين (كانت تُنتج NaN وسطوعًا سالبًا)، زر Escape يغلق الإعدادات مع دعم لوحة المفاتيح، الاهتزاز صار يعمل في كل الأنماط (كان في الكلمات/التلميح/المافيا فقط)، مستوى الصوت 0 صار صامتًا فعلًا، إصلاح تعلّق سحب الكاميرا عند pointercancel، توسيع منطقة لمس المفاتيح، وتأكيد قبل «إعادة الضبط».
243 — إصلاحات بعد اختبار الإعدادات في متصفح: خيار «حد الإطارات» الحالي لم يكن يُظلَّل، وهوامش بطاقة الملف الشخصي، وأسماء أزرار الدعم.
242 — شاشة «شخصيتي»: المعاينة صارت مثبّتة أعلى الشاشة دائمًا (جنبها الاسم وأزرار عشوائي/الأساس) والخيارات تتحرك تحتها، فترى كل تعديل مباشرة أثناء النزول.
241 — شاشة «شخصيتي» بتصميم جديد مريح للعين (معاينة كبيرة، بطاقات، ألوان وأزرار أوضح، شريط حفظ ثابت، عشوائي/إعادة للأساس، تنبيه التغييرات غير المحفوظة، النسخ الاحتياطي قابل للطي) بنفس وظائفها القديمة؛ وإعدادات جديدة: إعدادات جاهزة (توفير البطارية/متوازن/أعلى جودة)، حد الإطارات 30/60، مضاد التعرج، تقليل وميض المصباح، كتم الصوت عند مغادرة اللعبة، تأكيد قبل إغلاق الصفحة، نسخ تقرير المشكلة، إعادة تحميل اللعبة.
240 — إعادة تصميم شاشة الإعدادات: ألوان هادئة مريحة للعين، بطاقات وأقسام واضحة، شريط تبويبات سفلي (الملف/الرسومات/الصوت/التحكم/أخرى)، منزلقات وأزرار تشغيل أنيقة. إضافات جديدة: سطوع المشهد، وضع حماية العين (تدفئة الألوان)، أصوات الواجهة، الاهتزاز، حساسية الكاميرا وعكس السحب، إبقاء الشاشة مضاءة، ملء الشاشة، معلومات الجهاز والـGPU.
239 — زر الإعدادات ⚙ ثابت أعلى اليسار في كل الحالات (القائمة، الغرف، أثناء اللعب)، وأُزيل زرا الصوت (أعلى اليسار) والملف الشخصي (أعلى اليمين) وزر الإعدادات داخل القائمة؛ الصوت والملف الشخصي صارا داخل الإعدادات. الإعدادات تُفتح أثناء اللعب دون إيقاف اللعبة.
238 — خيار جديد في القائمة الرئيسية: «الإعدادات» بأقسام: الملف الشخصي (الاسم يُحفظ تلقائيًا + تعديل الشخصية)، الرسومات (جودة تلقائي/4K/عالية/متوسطة/منخفضة، الظلال، عدّاد FPS)، الصوت (تشغيل/كتم + مستوى الصوت)، أخرى (تقليل الحركة، إعادة الضبط). كلها تُحفظ في الجهاز ولا تمس باقي الأنماط.
237 — جودة 4K: دقة عرض ثلاثية الأبعاد حتى 3840 بكسل عرضًا (مع سقف ~8.9 ميغابكسل وسقف أخف للجوال)، ظلال المصباح 2048، تصفية متباينة الاتجاه حتى 16× للخامات، ملصقات الأسماء بضعف الدقة، وصور الأعلام SVG بضعف الدقة. بدون أي تغيير في التصميم أو الميكانيكا.
236 — إصلاح «تعذر تحميل العلم» (مصادر أعلام إضافية عبر cdnjs وjsDelivr مع إعادة محاولة، وعلم إيموجي احتياطي بدل رسالة الخطأ)؛ زر «لعبة جديدة» صار يعيد اللعب في نفس الغرفة بكل الأنماط (للمضيف) مع زر «القائمة الرئيسية» للخروج؛ شريط اللاعبين في الأعلام وحدود الدول والأسئلة العامة بدون قلوب (الاسم والنقاط فقط) وبحجم يتلاءم مع الشاشة.
235 — نمط المافيا: أجواء نوار (مشهد مدينة ليلي/صباحي، إطار آرت ديكو، ألوان وأزرار، نصوص، أصوات) بدون المساس بباقي الأنماط.
